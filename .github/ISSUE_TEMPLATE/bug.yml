name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose security vulnerabilities in a public issue. Use https://github.com/meza/curseforge-fingerprint/security/policy.
        For usage questions, use https://github.com/meza/curseforge-fingerprint/discussions.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behaviour and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest complete steps, repository, or sample that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project version
      placeholder: "For example: 1.2.3 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, runtime, architecture, browser, deployment, or dependency versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Remove credentials, tokens, personal data, and other sensitive information before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
